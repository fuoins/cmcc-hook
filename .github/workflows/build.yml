name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后同时发布/更新 GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Prepare Android SDK
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK_DIR" > local.properties
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR" >&2
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Read version
        id: ver
        run: |
          V="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "versionName = $V"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK (badging + signature)
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$SDK_DIR/build-tools/34.0.0"
          "$BT/aapt" dump badging "$APK" | head -5
          echo "---- 签名（应与 v3.98 起各版一致，保证覆盖安装）----"
          "$BT/apksigner" verify --print-certs "$APK" | head -8

      - name: Rename APK with version
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk \
             "out/cmcc-hook-v${{ steps.ver.outputs.name }}-release.apk"
          ls -lh out/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cmcc-hook-v${{ steps.ver.outputs.name }}-release
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: v${{ steps.ver.outputs.name }}
          body: |
            由 GitHub Actions 自动构建（`assembleRelease`），非本地手工编译产物。

            - 签名沿用仓库内固定 keystore，与 v3.98 起各版一致，可直接覆盖安装。
            - 覆盖安装后请重启手机；LSPosed 作用域需勾选「中国移动」+「电话服务 com.android.phone」。
            - 小米 / HyperOS 需在系统设置中关闭「验证码安全保护」、放行「通知类短信」。
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
